<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#07130d">
  <title>Luciana · Invitación</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      padding: 24px; background:
      radial-gradient(circle at 50% 30%, #193421 0, #07110b 42%, #020504 100%);
      color: #f4ead0; font-family: Georgia, serif; text-align: center;
    }
    .card {
      width: min(700px, 100%); padding: 60px 28px;
      border: 1px solid rgba(216,174,91,.35);
      box-shadow: 0 0 80px rgba(216,174,91,.08);
      background: rgba(5,12,8,.7);
    }
    h1 { margin: 0; font-family: Georgia, serif; font-size: clamp(38px, 8vw, 70px); }
    p { color: rgba(244,234,208,.65); line-height: 1.7; }
    a { color: #f5dfa4; text-decoration: none; }
  </style>
</head>
<body>
  <main class="card">
    <p>EL CUENTO CONTINÚA</p>
    <h1>Invitación</h1>
    <p>Esta es la página de destino. Aquí construiremos la invitación completa en el siguiente paso.</p>
    <a href="index.html">← Volver al inicio</a>
  </main>
</body>
</html>
